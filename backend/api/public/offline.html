<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Club Agelai - Sin conexion</title>
    <style>
        /* Minimal standalone fallback style for offline mode. */
        :root {
            color-scheme: dark;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at top, #122347 0%, #050d24 70%);
            color: #e8eefb;
        }
        .offline-card {
            width: min(92vw, 480px);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(11, 20, 48, 0.88);
            text-align: center;
        }
        .offline-card img {
            width: 84px;
            height: 84px;
            border-radius: 18px;
            margin-bottom: 1rem;
        }
        .offline-card h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
        }
        .offline-card p {
            margin: 0;
            line-height: 1.45;
            color: #c4d2f5;
        }
    </style>
</head>
<body>
<article class="offline-card">
    <img src="/assets/brand/agelai-logo.png" alt="Logo Club Agelai">
    <h1>Sin conexion temporal</h1>
    <p>No se pudo cargar la pagina. Revisa tu conexion y vuelve a intentarlo.</p>
</article>
</body>
</html>
